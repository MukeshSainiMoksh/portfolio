name: portfolio_admin
description: "Portfolio Admin Mobile App - Manage website content on the go"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3

  # Navigation
  go_router: ^14.1.4

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  # UI utilities
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.0

  # Form & validation
  reactive_forms: ^17.0.1

  # Utilities
  intl: 0.20.2
  path: ^1.9.0
  mime: ^1.0.5
  uuid: ^4.4.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Icons
  flutter_svg: ^2.0.10
  font_awesome_flutter: ^10.7.0

  # Notifications / feedback
  fluttertoast: ^8.2.8

  # Typography
  google_fonts: ^6.2.1
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
